<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Block all search engines and bots -->
  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
  <meta name="googlebot" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
  <meta name="bingbot" content="noindex, nofollow, noarchive, nosnippet">
  <meta name="slurp" content="noindex, nofollow, noarchive, nosnippet">
  <meta name="duckduckbot" content="noindex, nofollow, noarchive, nosnippet">
  <meta name="baiduspider" content="noindex, nofollow, noarchive, nosnippet">
  <meta name="yandexbot" content="noindex, nofollow, noarchive, nosnippet">
  <meta name="facebookexternalhit" content="noindex, nofollow, noarchive">
  <meta name="twitterbot" content="noindex, nofollow, noarchive">
  <meta name="linkedinbot" content="noindex, nofollow, noarchive">
  <!-- Block AI crawlers -->
  <meta name="GPTBot" content="noindex, nofollow">
  <meta name="ChatGPT-User" content="noindex, nofollow">
  <meta name="CCBot" content="noindex, nofollow">
  <meta name="Google-Extended" content="noindex, nofollow">
  <meta name="anthropic-ai" content="noindex, nofollow">
  <meta name="PerplexityBot" content="noindex, nofollow">
  <meta name="cohere-ai" content="noindex, nofollow">
  <title>studyGPT</title>
  <!-- PWA meta tags -->
  <meta name="theme-color" content="#4a90a4">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="studyGPT">
  <link rel="icon" href="/chat/favicon.ico" sizes="48x48">
  <link rel="icon" href="/chat/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/chat/apple-touch-icon.png">
  <meta name="description" content="AI-powered study assistant">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Charis+SIL:wght@400;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    /* Theme variables for loading screen */
    :root, [data-theme="light"] {
      --loading-bg: #fafafa;
      --loading-spinner-track: #e0e0e0;
      --loading-spinner-active: #404040;
      --loading-text: #686868;
    }
    [data-theme="dark"] {
      --loading-bg: #1a1a1a;
      --loading-spinner-track: #4a4a4a;
      --loading-spinner-active: #d0d0d0;
      --loading-text: #9a9a9a;
    }
    [data-theme="sepia"] {
      --loading-bg: #f4ecd8;
      --loading-spinner-track: #d4c9b5;
      --loading-spinner-active: #5c4a3d;
      --loading-text: #6b5a4d;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    #app-loading {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background-color: var(--loading-bg);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      z-index: 9999;
      opacity: 1;
      transition: opacity 0.3s ease-out;
    }
    #app-loading .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid var(--loading-spinner-track);
      border-top-color: var(--loading-spinner-active);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    #app-loading p {
      margin-top: 16px;
      font-size: 14px;
      color: var(--loading-text);
    }
  </style>
  <script>
    // Apply cached theme immediately to prevent flash
    try {
      var theme = localStorage.getItem('theme');
      if (theme && ['light', 'dark', 'sepia'].includes(theme)) {
        document.documentElement.setAttribute('data-theme', theme);
      }
    } catch (e) {}
  </script>
</head>
<body>
  <!-- Loading screen (outside #app so Vue doesn't replace it) -->
  <div id="app-loading">
    <div class="spinner"></div>
    <p>Loading...</p>
  </div>
  <div id="app"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
