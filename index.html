<!DOCTYPE html>
<html lang="en">
<head>
  <script>
    (function() {
      function showLogin() {
        var password = prompt('Please enter your password:');
        if (password === null) {
          // User cancelled
          return;
        }
        fetch('https://us-central1-nk-cloud-323802.cloudfunctions.net/auth', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password: password })
        })
        .then(function(response) {
          if (response.status === 200) {
            // Success, allow page to load
          } else {
            alert('Incorrect password.');
            showLogin();
          }
        })
        .catch(function() {
          alert('Network error.');
          showLogin();
        });
      }
      // Block rendering until login
      document.addEventListener('DOMContentLoaded', function() {
        showLogin();
      });
    })();
  </script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chat</title>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
